# Custom Stuff
backend = "glx";
vsync = true;
unredir-if-possible = true;

# Blur
blur-method = "dual_kawase";
blur-strength = 7;
blur-size = 10;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-background-exclude = [
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"class_g = 'fcitx'"
];

# Shadow
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
	"name = 'Notification'",
	"class_g = 'fcitx'"
];

# Fading
fading = true;
fade-delta = 3;

fade-exclude = [
	"class_g = 'Polybar'"
];

# Opacity
inactive-opacity = 0.8;
opacity-rule = [
	"100:class_g = 'Rofi'"
];

# Other
dbus = true;
detect-transient = true;
